name: Feature request
description: Suggest an improvement to the product or contributor experience.
title: "[Idea]: "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find an equivalent request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Who has this need, and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the outcome you want. Mockups or examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, screenshots, or implementation notes that may help.
