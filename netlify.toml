[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Runs the Next.js server on Netlify. Required now that the site renders per
# request: every page reads the visitor's session or the database.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers are not declared here: Next.js emits them itself (see
# `headers()` in `next.config.ts`), so Netlify and the Cloudflare Worker stay in
# step without two copies to keep in sync. Static asset caching does need a rule
# per host, because each CDN serves that output itself — Cloudflare's lives in
# `public/_headers`.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
